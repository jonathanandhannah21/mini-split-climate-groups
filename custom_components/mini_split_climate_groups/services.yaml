set_target_temperature:
  fields:
    entity_id: &group
      required: true
      selector:
        entity:
          domain: climate
          integration: mini_split_climate_groups
    member_id: &member
      required: true
      example: "living_room"
      selector:
        text:
    temperature:
      required: true
      selector:
        number:
          min: 60
          max: 85
          step: 1
          unit_of_measurement: "°F"

set_member_power:
  fields:
    entity_id: *group
    member_id: *member
    "on":
      required: true
      selector:
        boolean:

set_automation:
  fields:
    entity_id: *group
    enabled:
      required: true
      selector:
        boolean:

set_mode:
  fields:
    entity_id: *group
    mode:
      required: true
      selector:
        select:
          options:
            - cool
            - heat

set_tolerance:
  fields:
    entity_id: *group
    tolerance:
      required: true
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: "°F"

set_hysteresis:
  fields:
    entity_id: *group
    hysteresis:
      required: true
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: "°F"

set_priority_order:
  fields:
    entity_id: *group
    priority_order:
      required: true
      example: ["living_room", "bedroom"]
      selector:
        object:

set_schedules:
  fields:
    entity_id: *group
    schedules:
      required: true
      example:
        - name: Night
          start: "22:00"
          end: "07:00"
          days: [mon, tue, wed, thu, fri, sat, sun]
          priority_order: [bedroom, living_room]
      selector:
        object:

reset_to_default:
  fields:
    entity_id: *group
    member_id: *member
