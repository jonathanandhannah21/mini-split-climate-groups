set_target_temperature:
  name: Set Target Temperature
  description: Set target temperature for a specific member in the climate group.
  fields:
    entity_id:
      name: Entity
      description: Climate group entity ID.
      required: true
      selector:
        entity:
          domain: climate
          integration: mini_split_climate_groups
    member_id:
      name: Member ID
      description: ID of the member to adjust.
      required: true
      example: "living_room"
      selector:
        text:
    temperature:
      name: Temperature
      description: Target temperature in Fahrenheit.
      required: true
      selector:
        number:
          min: 60
          max: 85
          step: 1
          unit_of_measurement: "°F"

set_tolerance:
  name: Set Tolerance
  description: Set the tolerance for the climate group (degrees outside target before requesting mode change).
  fields:
    entity_id:
      name: Entity
      description: Climate group entity ID.
      required: true
      selector:
        entity:
          domain: climate
          integration: mini_split_climate_groups
    tolerance:
      name: Tolerance
      description: Tolerance in degrees Fahrenheit.
      required: true
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: "°F"

set_priority_order:
  name: Set Priority Order
  description: Set the priority order for members in the climate group.
  fields:
    entity_id:
      name: Entity
      description: Climate group entity ID.
      required: true
      selector:
        entity:
          domain: climate
          integration: mini_split_climate_groups
    priority_order:
      name: Priority Order
      description: List of member IDs in priority order (highest priority first).
      required: true
      example: ["living_room", "bedroom", "kitchen"]
      selector:
        object:

reset_to_default:
  name: Reset to Default
  description: Reset a member's target temperature to its default value.
  fields:
    entity_id:
      name: Entity
      description: Climate group entity ID.
      required: true
      selector:
        entity:
          domain: climate
          integration: mini_split_climate_groups
    member_id:
      name: Member ID
      description: ID of the member to reset.
      required: true
      example: "living_room"
      selector:
        text: